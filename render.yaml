services:
  # ── Backend: FastAPI (Python Web Service) ──────────────────────────────────
  - type: web
    name: vigilant-x
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    tier: free
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: OPENWEATHERMAP_API_KEY
        sync: false
      - key: NASA_FIRMS_API_KEY
        sync: false
      - key: PYTHON_VERSION
        value: 3.11.9


  # ── Frontend: React/Vite (Static Site) ────────────────────────────────────
  - type: static
    name: vigilant-x-frontend
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        value: https://vigilant-x.onrender.com
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
